<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title description">
  <title id="title">Neem Cake Organic Manure</title>
  <desc id="description">Illustration of an earthy organic manure bag with neem leaves and neem cake granules.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2df"/>
      <stop offset="1" stop-color="#c8d8b1"/>
    </linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="1" y2=".15">
      <stop offset="0" stop-color="#a77b43"/>
      <stop offset=".18" stop-color="#d7b77b"/>
      <stop offset=".53" stop-color="#ead8ae"/>
      <stop offset=".86" stop-color="#d2b27a"/>
      <stop offset="1" stop-color="#9a713d"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#376c3d"/>
      <stop offset="1" stop-color="#214b2e"/>
    </linearGradient>
    <filter id="shadow" x="-.4" y="-.4" width="1.8" height="1.8">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".23"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
