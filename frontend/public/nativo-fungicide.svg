    <text x="299" y="362" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="800" text-anchor="middle" letter-spacing="1">NATIVO</text>
    <path d="M224 376h150" stroke="#a8c88f" stroke-width="2" opacity=".8"/>
    <text x="299" y="401" fill="#e7edda" font-family="Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">FUNGICIDE</text>
    <path d="M214 456q84 18 170 0v19q0 25-25 25h-120q-25 0-25-25z" fill="#e9e5d6" opacity=".7"/>
